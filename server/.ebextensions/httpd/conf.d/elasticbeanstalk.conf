ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
   LoadModule rewrite_module modules/mod_rewrite.so

   RewriteEngine On
   RewriteCond %{HTTP:X-Forwarded-Proto} !https
   RewriteCond %{HTTP_USER_AGENT} !ELB-HealthChecker
   RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI} [L]

   # This looks for any HTTP verbs other than POST, GET, PATCH or DELETE.
   # If it finds them, it sends a 403 Forbidden response.
   #RewriteCond %{REQUEST_METHOD} !^(POST|GET|PATCH|DELETE|OPTIONS)$
   RewriteCond %{REQUEST_METHOD} !^(POST|GET|PATCH|DELETE|OPTIONS)$
   RewriteRule .* - [F]

   Options +FollowSymLinks
   RewriteCond %{HTTP_USER_AGENT} Mb2345Browser|LieBaoFast|zh-CN|MicroMessenger|zh_CN|Kinza|Datanyze|serpstatbot|spaziodati|OPPO\sA33|AspiegelBot|aspiegel|PetalBot|ByteSpider [NC]
   RewriteRule ^ - [F,L]

   <Proxy *>
     Require all granted
   </Proxy>

   <LocationMatch "^/(api|assets|static/js)/.*">
      Header always set Cache-Control 'private, no-cache, no-store, must-revalidate, pre-check=0, post-check=0, max-age=0, s-maxage=0, no-transform'
      Header always set Pragma 'no-cache'
      Header always set Expires 0
   </LocationMatch>

   <LocationMatch ".*">
      Header always set Strict-Transport-Security 'max-age=31536000; preload'
      Header always set X-Content-Type-Options 'nosniff'
      Header always set X-Frame-Options 'sameorigin'
      Header always set Content-Security-Policy "frame-ancestors 'none'; object-src 'none';  frame-src *.google.com https://accounts.google.com/gsi/ https://miro.com https://www.figma.com *.sharepoint.com; default-src 'self'; font-src 'self' data: https:; img-src 'self' *.example.com data:  https://*.googleusercontent.com  https://apis.google.com * blob: 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com/gsi/client https://apis.google.com/js/api.js https://apis.google.com/_/scs/apps-static/_/js/ https://apis.google.com/_/scs/abc-static/_/js/ https://apis.google.com/_/scs/apps-static/_/j; style-src 'self' https://accounts.google.com/gsi/style https: 'unsafe-inline'; connect-src https:; upgrade-insecure-requests"
      Header always set X-Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; default-src 'self'; font-src 'self' data: https:; img-src 'self' *.example.com data: https://apis.google.com https://*.googleusercontent.com * blob: 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com/js/api.js https://apis.google.com/_/scs/apps-static/_/js/ https://apis.google.com/_/scs/abc-static/_/js/; style-src 'self' https: 'unsafe-inline'; connect-src https:; upgrade-insecure-requests"
      Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
      Header always set Referrer-Policy 'strict-origin-when-cross-origin'
      Header always set Access-Control-Allow-Methods "POST, GET, OPTIONS, DELETE, PUT, PATCH"
      Header always set Access-Control-Allow-Headers "Content-Type, Access-Control-Allow-Headers, Authorization, X-Requested-With, pragma, cache-control"
   </LocationMatch>

   ProxyPass / http://localhost:8080/ retry=0
   ProxyPassReverse / http://localhost:8080/
   ProxyPreserveHost on

   LimitRequestFieldSize 10000
   ErrorLog /var/log/httpd/elasticbeanstalk-error_log

</VirtualHost>
