# Serves the built frontend for the "fast" mode of ./start.sh. Local use only —
# production is served by the Grails war, not by this.
server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The app uses HashRouter, so every route is served from / and the client
    # reads the fragment. The fallback below is belt and braces.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built asset filenames contain a content hash, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
